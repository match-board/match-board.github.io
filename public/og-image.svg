<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F12" />
      <stop offset="50%" stop-color="#131A20" />
      <stop offset="100%" stop-color="#0B0F12" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#287A74" />
      <stop offset="100%" stop-color="#55A9A0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="1152" height="582" rx="32" stroke="#287A74" stroke-width="2" stroke-opacity="0.5" />

  <!-- Top Header Badge -->
  <rect x="440" y="58" width="320" height="40" rx="20" fill="#131A20" stroke="#AEEED3" stroke-width="1.5" stroke-opacity="0.4" />
  <circle cx="468" cy="78" r="6" fill="#AEEED3" />
  <text x="610" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#AEEED3" letter-spacing="2" text-anchor="middle">ZERO-SERVER LIVE SCOREBOARD</text>

  <!-- Title -->
  <text x="600" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">
    MATCH<tspan fill="#AEEED3">BOARD</tspan>
  </text>

  <!-- Team A Card -->
  <rect x="130" y="205" width="430" height="300" rx="28" fill="#131A20" stroke="#287A74" stroke-width="3" />
  <rect x="130" y="205" width="430" height="12" rx="6" fill="#287A74" />
  <text x="345" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#94A3B8" letter-spacing="3" text-anchor="middle">HOME TEAM</text>
  <text x="345" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="165" font-weight="900" fill="#AEEED3" text-anchor="middle">24</text>

  <!-- VS / Period Pill -->
  <rect x="572" y="315" width="56" height="80" rx="14" fill="#0B0F12" stroke="#55A9A0" stroke-width="2" />
  <text x="600" y="350" font-family=" monospace" font-size="13" font-weight="700" fill="#AEEED3" text-anchor="middle">SET 2</text>
  <text x="600" y="375" font-family=" monospace" font-size="14" font-weight="800" fill="#FFF8B0" text-anchor="middle">LIVE</text>

  <!-- Team B Card -->
  <rect x="640" y="205" width="430" height="300" rx="28" fill="#131A20" stroke="#55A9A0" stroke-width="3" />
  <rect x="640" y="205" width="430" height="12" rx="6" fill="#55A9A0" />
  <text x="855" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#94A3B8" letter-spacing="3" text-anchor="middle">GUEST TEAM</text>
  <text x="855" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="165" font-weight="900" fill="#FFF8B0" text-anchor="middle">21</text>

  <!-- Footer Tagline -->
  <text x="600" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#94A3B8" letter-spacing="1" text-anchor="middle">
    OBS Broadcast Chroma-Key • Instant URL Link Sharing • Unlimited Offline Storage
  </text>
</svg>
